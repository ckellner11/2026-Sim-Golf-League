<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pair League Score Sync</title><style>body{font:18px/1.6 system-ui;background:#173d33;color:#eee7d4;max-width:650px;margin:40px auto;padding:24px}button,input{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}input{width:100%}button{cursor:pointer}#status{white-space:pre-wrap}</style><h1>Pair League Score Sync</h1><p>Sign in with an authorized league scoring account. Copy the one-time code into the PC app. Codes expire after five minutes. Pair only a PC you control.</p><button id="login" disabled>Loading Google sign-in…</button><p id="status" role="status"></p><input id="code" aria-label="One-time pairing code" readonly hidden><button id="copy" hidden>Copy code</button><p>The PC session lasts up to four hours. No password or client secret goes into the PC app.</p><script src="config.js"></script><script src="scoring-config.js"></script><script>
let client;const status=document.getElementById('status'),login=document.getElementById('login');
async function post(body){const r=await fetch(window.LEAGUE_CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),credentials:'omit'});const x=await r.json();if(!x.ok)throw Error(x.error||'Pairing failed');return x;}
async function signedIn(response){login.disabled=true;try{if(response.error||!response.code)throw Error('Sign-in canceled.');status.textContent='Creating your one-time code…';const session=await post({action:'signIn',code:response.code});const result=await post({action:'syncPairCode',session:session.session});try{await post({action:'signOut',session:session.session});}catch{}document.getElementById('code').value=result.code;document.getElementById('code').hidden=false;document.getElementById('copy').hidden=false;status.textContent='Code ready for '+session.email+'. Paste it into the PC app within five minutes.';}catch(e){status.textContent=e.message;}finally{login.disabled=false;}}
function googleReady(){client=google.accounts.oauth2.initCodeClient({client_id:window.LEAGUE_SCORING.clientId,scope:'openid email',ux_mode:'popup',callback:signedIn,error_callback:()=>{status.textContent='Sign-in window could not open.';login.disabled=false;}});login.textContent='Sign in and create pairing code';login.disabled=false;login.onclick=()=>client.requestCode();}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('code').value);status.textContent='Copied. Paste into the PC app.';}catch{status.textContent='Select and copy the code manually.';}};
</script><script src="https://accounts.google.com/gsi/client" async onload="googleReady()" onerror="document.getElementById('status').textContent='Google sign-in could not load.'"></script></html>
